<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChessLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">♞</span><span>Chess<span class="lab">Lab</span></span></div>
    <nav id="tabs">
      <button data-tab="explorer" class="active">Ouvertures</button>
      <button data-tab="repertoire">Mon répertoire</button>
      <button data-tab="analysis">Scanner &amp; Plan</button>
      <button data-tab="lessons">Cours</button>
      <button data-tab="training">Entraînement</button>
    </nav>
    <span id="db-chip" class="chip"></span>
    <button id="account-btn" class="ghost" title="Compte Lichess">Se connecter avec Lichess</button>
    <button id="settings-btn" class="ghost" title="Réglages">⚙ Réglages</button>
  </header>

  <main class="layout">
    <section class="board-col">
      <div id="board-wrap"><div id="board" class="cg-wrap"></div></div>
      <div id="eval-bar"><div id="eval-fill"></div></div><span id="eval-text"></span>
      <div class="controls">
        <button id="nav-start" title="Début">⏮</button>
        <button id="nav-prev" title="Précédent (←)">◀</button>
        <button id="nav-next" title="Suivant (→)">▶</button>
        <button id="nav-end" title="Fin">⏭</button>
        <button id="flip" title="Retourner l'échiquier (f)">⇅</button>
        <button id="reset" title="Position initiale">↺</button>
        <button id="load-btn" title="Charger FEN / PGN">📋 FEN/PGN</button>
      </div>
      <div id="opening-name" class="opening-name"></div>
      <div id="moves" class="moves"></div>
    </section>

    <section class="panel-col">
      <div id="panel-explorer" class="panel active"></div>
      <div id="panel-repertoire" class="panel"></div>
      <div id="panel-analysis" class="panel"></div>
      <div id="panel-lessons" class="panel"></div>
      <div id="panel-training" class="panel"></div>
    </section>
  </main>

  <dialog id="settings-dlg"></dialog>
  <dialog id="account-dlg"></dialog>
  <dialog id="load-dlg"></dialog>
  <dialog id="promo-dlg"></dialog>
  <div id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
